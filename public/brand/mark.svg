<!-- Tech Groww Pure-Vector Mark (Dark Ink Variant — traced from official techgroww_logo.svg) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Tech Groww mark">
  <defs>
    <linearGradient id="tg-left-dark" x1="60" y1="12" x2="22" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="tg-right-dark" x1="60" y1="12" x2="98" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="tg-wing-l-dark" x1="12" y1="96" x2="60" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="tg-wing-r-dark" x1="60" y1="70" x2="108" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Left faceted arrowhead -->
  <polygon points="60,12 20,76 42,76 60,54" fill="url(#tg-left-dark)" />
  <!-- Right faceted arrowhead -->
  <polygon points="60,12 100,76 78,76 60,54" fill="url(#tg-right-dark)" />
  <!-- Center inner bevel facets -->
  <polygon points="60,54 42,76 60,68" fill="#0369A1" opacity="0.9" />
  <polygon points="60,54 78,76 60,68" fill="#0284C7" />
  <!-- Splayed chevron wings -->
  <polygon points="60,68 42,76 8,96 28,96 60,78" fill="url(#tg-wing-l-dark)" />
  <polygon points="60,68 78,76 112,96 92,96 60,78" fill="url(#tg-wing-r-dark)" />
</svg>
